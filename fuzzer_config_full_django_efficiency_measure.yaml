# Fuzzer Configuration for DjangoWebApplication Target - FULL Configuration

# --- Experiment Settings ---
experiment_name: "full"
target_name: "django"
output_base_dir: "efficiency_measure/django/full/" # Base directory for this config's runs
run_duration_hours: 2

# --- Fuzzer Feature Flags ---
use_coverage_feedback: true
use_constraint_mutation: true
use_seed_prioritization: true

# --- Fuzzer Settings ---
target_endpoint: "http://127.0.0.1:8000/datatb/product/add/" # Full URL of the target API endpoint
max_iterations: 1000000   # Set high, rely on duration or mutation limit
total_mutation_limit: 1000000 # Set high, rely on duration
request_timeout: 2        # Timeout in seconds for individual HTTP requests
memory_threshold_mb: 1024 # Memory usage threshold (MB) for detecting potential DoS during timeouts
seed_file_path: "fuzzer/initial_seeds.jsonl" # Path to the initial seeds file (JSON Lines format)
unique_errors_file: "unique_errors.jsonl" # Output file for unique errors found (JSON Lines format) - Will be placed in run-specific dir

# --- Target Execution Settings ---
target_script: "django/manage.py" # Path to the python script to run under coverage
target_args: ["runserver", "8000", "--noreload"]       # List of arguments for the target script (Using Port 8000)
coverage_source: "django"         # Optional: Path for coverage --source flag (can be empty or omitted)
coverage_data_file: ".coverage_django_full"            # Specific coverage data file base name

# --- Power Schedule Settings ---
energy_const: 100        # Base energy factor (AFL default often higher, e.g., 5000)
max_energy: 15000         # Maximum energy (mutations) assigned to any single seed

# --- Input Structure & Constraints ---
# Define the structure and constraints of the input data dictionary
# used for the /datatb/product/add/ endpoint.
input_structure:
  name: # Field name
    type: string # Data type (string, integer, float, boolean, etc.)
    constraints:
      # allowed_chars: "abcdefg..." # Example: Regex or list of chars
      # forbidden_chars: "<>\"'" # Example
      # min_length: 1 # Minimum length of the string
      # max_length: 100 # Example
  info:
    type: string
    constraints:
      # allowed_chars: "abcdefg..."
      # forbidden_chars: "<>\"'"
      # min_length: 1 # Minimum length of the string
      # max_length: 1
  price:
    # Although the model uses IntegerField, JSON typically uses numbers which Python reads as int or float.
    # Let's define constraints assuming the input *could* be float but should ideally be int.
    # The target model uses models.IntegerField(blank=True, null=True)
    type: integer # Or 'float' - let's stick to integer based on model
    constraints:
    # not_equal_to: 0 # Example
      # min_value: 0 # Minimum value
      # max_value: 1000000 # Example
  # Add other fields here if the API expects more complex JSON structure
